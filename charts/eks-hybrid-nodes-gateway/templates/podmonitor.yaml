{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "eks-hybrid-nodes-gateway.fullname" . }}
  namespace: {{ include "eks-hybrid-nodes-gateway.namespace" . }}
  labels:
    {{- include "eks-hybrid-nodes-gateway.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.podMonitor.additionalLabels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  podMetricsEndpoints:
    - path: /metrics
      port: metrics
      {{- with .Values.podMonitor.internval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "eks-hybrid-nodes-gateway.namespace" . }}
  selector:
    matchLabels:
      {{- include "eks-hybrid-nodes-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
